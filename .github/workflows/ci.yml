name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm
          POSTGRES_DB: rm_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The integration suites isolate themselves per (project, worker) by
      # creating their own Postgres schema inside this one database -- see
      # libs/db/src/testing -- so no extra service or database is needed
      # beyond this single Postgres 16 container.
      TEST_DATABASE_URL: postgresql://rm:rm@localhost:5433/rm_test
      DATABASE_URL: postgresql://rm:rm@localhost:5433/rm_test
      JWT_SECRET: ci-secret-that-is-long-enough-32
      APP_BASE_URL: http://localhost:3000
      CLIENT_APP_URL: http://localhost:4201
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: ./storage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generates the Prisma client into libs/db/src/generated. It is
      # gitignored and rebuilt on every install (see the root `postinstall`
      # script), but this step is kept explicit: nothing that imports @rm/db
      # -- which is most of the workspace -- can typecheck, lint, test or
      # build without it.
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm api:types
      - name: Fail if the generated API client is stale
        # Proves the committed libs/api-client/src/lib/schema.d.ts matches
        # the committed Zod contract in libs/contracts: regenerating it here
        # from scratch must be a no-op.
        run: git diff --exit-code libs/api-client/src/lib/schema.d.ts
      - run: pnpm nx run-many -t typecheck lint test build

  # Task 21: the customer app end to end, against the real API and a real
  # PostgreSQL. A job of its own so a slow or failing browser run never hides
  # the unit suite's verdict, and the unit job never pays for browsers.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rm
          POSTGRES_PASSWORD: rm
          POSTGRES_DB: rm_e2e
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U rm -d rm_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      # The suite builds every other variable it needs itself (ports, the
      # blanked Stripe keys that select the fake payment provider, local
      # storage) -- see apps/client-e2e/src/support/e2e-env.ts. These are the
      # ones a developer would otherwise get from their own .env.
      E2E_DATABASE_URL: postgresql://rm:rm@localhost:5433/rm_e2e
      DATABASE_URL: postgresql://rm:rm@localhost:5433/rm_e2e
      JWT_SECRET: ci-secret-that-is-long-enough-32
      APP_BASE_URL: http://localhost:3100
      CLIENT_APP_URL: http://localhost:4300
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm nx e2e client-e2e
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-e2e-report
          path: |
            dist/client-e2e-report
            dist/client-e2e-results
          retention-days: 7

