<div class="login-page">
  <section class="login-brand" aria-hidden="true">
    <img src="brand/logo-on-light.png" alt="" class="login-logo" width="160" height="160" />
    <p class="login-wordmark">La Ruta<br />Mochilera</p>
    <p class="login-tagline">{{ 'brand.tagline' | translate }}</p>
  </section>

  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>{{ 'auth.panelTitle' | translate }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'auth.email' | translate }}</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ 'auth.password' | translate }}</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (error()) {
          <p class="login-error">{{ error() | rmErrorCode }}</p>
        }

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="form.invalid || loading()"
        >
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
            {{ 'auth.signingIn' | translate }}
          } @else {
            {{ 'auth.signIn' | translate }}
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
