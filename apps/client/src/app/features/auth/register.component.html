<div class="auth-page">
  <div class="auth-card">
    <h1>{{ 'auth.register' | translate }}</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        {{ 'auth.fullName' | translate }}
        <input type="text" formControlName="fullName" autocomplete="name" />
      </label>

      <label>
        {{ 'auth.email' | translate }}
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        {{ 'auth.phone' | translate }}
        <input type="tel" formControlName="phone" autocomplete="tel" />
      </label>

      <label>
        {{ 'auth.birthDate' | translate }}
        <input type="date" formControlName="birthDate" />
      </label>

      <label>
        {{ 'auth.password' | translate }}
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>

      <label class="auth-checkbox">
        <input type="checkbox" formControlName="acceptTerms" />
        {{ 'auth.acceptTerms' | translate }}
      </label>

      @if (error()) {
        <p class="auth-error">{{ error() | rmErrorCode }}</p>
      }

      <button type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? ('auth.registering' | translate) : ('auth.register' | translate) }}
      </button>
    </form>

    <p class="auth-switch">
      <a routerLink="/login">{{ 'auth.haveAccount' | translate }}</a>
    </p>
  </div>
</div>
