<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/" class="auth-logo" aria-label="La Ruta Mochilera"><img src="brand/logo-on-dark.png" alt="" width="72" height="72" /></a>
    <h1>Ruta Mochilera</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        {{ 'auth.email' | translate }}
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        {{ 'auth.password' | translate }}
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      @if (error()) {
        <p class="auth-error">{{ error() | rmErrorCode }}</p>
      }

      <button type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? ('auth.signingIn' | translate) : ('auth.signIn' | translate) }}
      </button>
    </form>

    <p class="auth-switch">
      <a routerLink="/forgot-password">{{ 'auth.forgotPassword' | translate }}</a>
      <a routerLink="/register" [queryParams]="{ returnUrl: returnUrl }">{{ 'auth.needAccount' | translate }}</a>
    </p>
  </div>
</div>
