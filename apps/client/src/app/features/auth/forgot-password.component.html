<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/" class="auth-logo" aria-label="La Ruta Mochilera"><img src="brand/logo-on-dark.png" alt="" width="72" height="72" /></a>
    <h1>{{ 'auth.forgot.title' | translate }}</h1>

    @if (sent()) {
      <p class="auth-notice">{{ 'auth.forgot.sent' | translate }}</p>
    } @else {
      <p class="auth-intro">{{ 'auth.forgot.intro' | translate }}</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label>
          {{ 'auth.email' | translate }}
          <input type="email" formControlName="email" autocomplete="email" />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <span class="field-error">{{ 'auth.validation.email' | translate }}</span>
          }
        </label>

        @if (error()) {
          <p class="auth-error">{{ error() | rmErrorCode }}</p>
        }

        <button type="submit" [disabled]="loading()">
          {{ loading() ? ('auth.forgot.submitting' | translate) : ('auth.forgot.submit' | translate) }}
        </button>
      </form>
    }

    <p class="auth-switch">
      <a routerLink="/login">{{ 'auth.backToSignIn' | translate }}</a>
    </p>
  </div>
</div>
