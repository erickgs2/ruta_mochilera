# QA and production stack for the EC2 (amd64) host. Unlike compose.dev.yml
# and compose.test.yml (Postgres-only, dev/test run against a native
# Postgres locally), this file runs the full stack in containers: nginx,
# the Next.js api and Postgres itself, built from infra/docker/Dockerfile.api
# and Dockerfile.web.
#
# Run from the repo root so both `${VAR}` substitution below and `env_file`
# resolve against .env.prod (see .env.prod.example) -- deliberately NOT the
# developer's own .env, which carries NODE_ENV=development, a local
# JWT_SECRET and localhost-only defaults that have no business running in a
# container:
#   docker compose -f infra/compose/compose.prod.yml --env-file .env.prod up -d --build
#
# There is no volume for STORAGE_LOCAL_ROOT here: qa and production use
# STORAGE_DRIVER=s3, so there is no local upload directory to persist (see
# compose.dev.yml for the local-driver case).
services:
  postgres:
    image: postgres:16-alpine
    container_name: rm-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rm_prod}
    volumes:
      - rm-pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rm} -d ${POSTGRES_DB:-rm_prod}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ruta-mochilera/api:latest
    container_name: rm-api-prod
    restart: unless-stopped
    env_file:
      - ../../.env.prod
    environment:
      # Belt-and-suspenders: the Dockerfile already sets ENV NODE_ENV=production
      # in the runner stage, but `environment:` here takes precedence over both
      # the image's ENV and env_file, so a stray NODE_ENV=development in
      # .env.prod (e.g. from copy-pasting the dev .env by mistake) can never
      # silently override it again at the container level.
      NODE_ENV: production
      # Overrides .env.prod's own DATABASE_URL (a placeholder there only for
      # `docker compose config` to validate) so the containerized api reaches
      # the containerized Postgres by its compose service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-rm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rm_prod}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'

  # TLS is terminated by this Nginx itself (see
  # infra/nginx/nginx.conf.template's doc comment for why, versus a load
  # balancer in front): it answers both 80 (ACME challenge + redirect to
  # HTTPS) and 443, with a certificate from Let's Encrypt that the `certbot`
  # service below obtains and renews into the `rm-certbot-conf` volume this
  # container also mounts, read-only, at the standard
  # /etc/letsencrypt path.
  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    image: ruta-mochilera/web:latest
    container_name: rm-nginx-prod
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - rm-certbot-conf:/etc/letsencrypt:ro
      - rm-certbot-www:/var/www/certbot:ro
    # `certbot renew` (below) writes the renewed certificate into the shared
    # `rm-certbot-conf` volume, but nginx workers only ever read a
    # certificate file once, at startup or reload -- a renewal alone changes
    # nothing this container is serving. There is no cross-container signal
    # wired from `certbot` to this container (that needs either the docker
    # socket or a shared process namespace, both more than Phase 1 needs for
    # a file that changes every ~60 days), so this overrides the image's
    # default command to reload nginx itself on a fixed schedule instead:
    # `nginx -s reload` is a graceful, zero-downtime reload (new workers
    # spawned, old ones drain) and a no-op in effect when the certificate on
    # disk has not actually changed, so doing it on a timer rather than only
    # after a real renewal costs nothing.
    command: >-
      sh -c '(while :; do sleep 6h; nginx -s reload; done) & exec nginx -g "daemon off;"'

  # Issues and renews the Let's Encrypt certificate `nginx` serves (into the
  # `rm-certbot-conf` volume `nginx` also mounts, read-only). The initial
  # certificate does not exist yet on a fresh host: run, once, after `nginx`
  # is up and DNS for `${DOMAIN_NAME}` already points here --
  #   docker compose -f infra/compose/compose.prod.yml --env-file .env.prod \
  #     run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d ${DOMAIN_NAME} --email <ops-email> --agree-tos --no-eff-email
  # -- then `docker compose ... restart nginx` once so it picks up the new
  # files immediately rather than waiting for its own reload timer above.
  # From then on this service's loop renews automatically and nginx's own
  # loop reloads within six hours of any renewal -- comfortably inside Let's
  # Encrypt's ~30-day renewal window before a 90-day certificate expires.
  certbot:
    image: certbot/certbot:latest
    container_name: rm-certbot-prod
    restart: unless-stopped
    volumes:
      - rm-certbot-conf:/etc/letsencrypt
      - rm-certbot-www:/var/www/certbot
    entrypoint: >-
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done'

volumes:
  rm-pgdata-prod:
  rm-certbot-conf:
  rm-certbot-www:
