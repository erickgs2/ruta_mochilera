services:
  postgres-test:
    image: postgres:16-alpine
    container_name: rm-postgres-test
    environment:
      POSTGRES_USER: rm
      POSTGRES_PASSWORD: rm
      POSTGRES_DB: rm_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rm -d rm_test']
      interval: 5s
      timeout: 5s
      retries: 10
