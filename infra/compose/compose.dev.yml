services:
  postgres:
    image: postgres:16-alpine
    container_name: rm-postgres-dev
    environment:
      POSTGRES_USER: rm
      POSTGRES_PASSWORD: rm
      POSTGRES_DB: rm_dev
    ports:
      - '5432:5432'
    volumes:
      - rm-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rm -d rm_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rm-pgdata-dev:
