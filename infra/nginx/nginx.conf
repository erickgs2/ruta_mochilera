server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # The API and the admin panel live behind this single front door. The
    # `api` hostname is the compose service name from compose.prod.yml.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # The customer-facing app is Phase 2 and does not exist yet, so the root
    # path redirects to the admin panel for now.
    location / {
        return 302 /admin/;
    }
}
